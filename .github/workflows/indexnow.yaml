name: IndexNow + Google Indexing API on publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "content/**/*.mdx"
      - "app/page.js"
      - "app/about/page.js"
      - "app/contact/page.js"
      - "app/projects/page.js"
      - "app/blog/page.js"

jobs:
  ping-indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for deploy
        run: sleep 60

      - name: Build changed URL list
        id: urls
        shell: bash
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILES=$(find content -type f -name '*.mdx' -print)
            FILES="$FILES"$'\n'"app/page.js"$'\n'"app/about/page.js"$'\n'"app/contact/page.js"$'\n'"app/projects/page.js"$'\n'"app/blog/page.js"
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            FILES=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'content/**/*.mdx' 'app/page.js' 'app/about/page.js' 'app/contact/page.js' 'app/projects/page.js' 'app/blog/page.js' || true)
          else
            FILES=$(git diff --name-only --diff-filter=AM "$BEFORE" "${{ github.sha }}" -- 'content/**/*.mdx' 'app/page.js' 'app/about/page.js' 'app/contact/page.js' 'app/projects/page.js' 'app/blog/page.js')
          fi

          URLS="[]"
          for file in $FILES; do
            if [[ "$file" == content/blog/* ]]; then
              slug=$(basename "$file" .mdx)
              url="https://brightjasper.com/blog/$slug"
            elif [[ "$file" == content/projects/* ]]; then
              slug=$(basename "$file" .mdx)
              url="https://brightjasper.com/projects/$slug"
            elif [[ "$file" == "app/page.js" ]]; then
              url="https://brightjasper.com/"
            elif [[ "$file" == "app/about/page.js" ]]; then
              url="https://brightjasper.com/about"
            elif [[ "$file" == "app/contact/page.js" ]]; then
              url="https://brightjasper.com/contact"
            elif [[ "$file" == "app/projects/page.js" ]]; then
              url="https://brightjasper.com/projects"
            elif [[ "$file" == "app/blog/page.js" ]]; then
              url="https://brightjasper.com/blog"
            else
              continue
            fi
            URLS=$(jq --arg url "$url" '. + [$url]' <<< "$URLS")
          done

          echo "urls=$(jq -c . <<< "$URLS")" >> "$GITHUB_OUTPUT"

      - name: Submit to IndexNow (Bing, Yandex, Seznam, etc.)
        if: steps.urls.outputs.urls != '[]'
        env:
          URLS: ${{ steps.urls.outputs.urls }}
        run: |
          INDEXNOW_KEY=$(tr -d '\r\n' < "public/3da3fdd8350690809016ea2ea9463c76c6040b5d0339d43f7835cea88f5f0963.txt")
          jq -n \
            --arg host "brightjasper.com" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "https://brightjasper.com/$INDEXNOW_KEY.txt" \
            --argjson urlList "$URLS" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}' \
            | curl --fail-with-body -sS -X POST "https://api.indexnow.org/indexnow" \
                -H "Content-Type: application/json; charset=utf-8" \
                --data-binary @-

      - name: Submit to Google Indexing API
        if: steps.urls.outputs.urls != '[]'
        env:
          URLS: ${{ steps.urls.outputs.urls }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          npm ci --omit=dev
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > google-service-account.json
          node scripts/google-indexing.js $(jq -r '.[]' <<< "$URLS")
