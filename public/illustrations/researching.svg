<svg viewBox="0 0 240 200" xmlns="http://www.w3.org/2000/svg" width="240" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Illustration of a person reviewing research documents</title>
  <!-- floor line -->
  <line x1="20" y1="170" x2="220" y2="170" stroke="#185FA5" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <!-- stack of papers -->
  <rect x="40" y="130" width="50" height="40" rx="3" fill="none" stroke="#185FA5" stroke-width="2.5"/>
  <line x1="48" y1="142" x2="82" y2="142" stroke="#185FA5" stroke-width="2"/>
  <line x1="48" y1="152" x2="82" y2="152" stroke="#185FA5" stroke-width="2"/>
  <line x1="48" y1="162" x2="70" y2="162" stroke="#185FA5" stroke-width="2"/>
  <!-- person: head -->
  <circle cx="150" cy="90" r="15" fill="none" stroke="#185FA5" stroke-width="2.5"/>
  <!-- torso walking pose -->
  <path d="M150 105 L150 140" stroke="#185FA5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M150 140 L135 170" stroke="#185FA5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M150 140 L168 168" stroke="#185FA5" stroke-width="2.5" stroke-linecap="round"/>
  <!-- arm holding magnifier -->
  <path d="M150 115 Q170 118, 178 130" fill="none" stroke="#185FA5" stroke-width="2.5" stroke-linecap="round"/>
  <!-- magnifying glass -->
  <circle cx="190" cy="140" r="12" fill="none" stroke="#185FA5" stroke-width="2.5"/>
  <line x1="198" y1="148" x2="208" y2="158" stroke="#185FA5" stroke-width="2.5" stroke-linecap="round"/>
  <!-- other arm -->
  <path d="M150 115 Q130 122, 122 132" fill="none" stroke="#185FA5" stroke-width="2.5" stroke-linecap="round"/>
</svg>
