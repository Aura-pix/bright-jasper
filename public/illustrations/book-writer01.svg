<svg viewBox="0 0 240 200" xmlns="http://www.w3.org/2000/svg" width="240" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Illustration of a person writing at a desk</title>
  <!-- desk -->
  <line x1="30" y1="160" x2="210" y2="160" stroke="#185FA5" stroke-width="2.5" stroke-linecap="round"/>
  <!-- lamp -->
  <line x1="55" y1="160" x2="55" y2="110" stroke="#185FA5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M40 110 L70 110 L60 90 L50 90 Z" fill="none" stroke="#185FA5" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- open book -->
  <path d="M100 160 L100 130 Q120 122 140 130 L140 160 Q120 152 100 160 Z" fill="none" stroke="#185FA5" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="120" y1="126" x2="120" y2="156" stroke="#185FA5" stroke-width="2"/>
  <!-- person: head -->
  <circle cx="155" cy="95" r="16" fill="none" stroke="#185FA5" stroke-width="2.5"/>
  <!-- torso -->
  <path d="M135 160 C135 130, 175 130, 175 160 Z" fill="none" stroke="#185FA5" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- arm to book -->
  <path d="M140 135 Q125 140, 118 150" fill="none" stroke="#185FA5" stroke-width="2.5" stroke-linecap="round"/>
  <!-- pen in hand -->
  <line x1="118" y1="150" x2="108" y2="158" stroke="#185FA5" stroke-width="2" stroke-linecap="round"/>
</svg>
